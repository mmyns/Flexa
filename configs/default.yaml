# Flexa Time Series Forecasting Configuration

data:
  time_column: "timestamp"
  target_column: "target"
  id_column: "series_id"
  freq: "1d"

features:
  lags: [1, 2, 3, 7, 14, 28]
  rolling_windows: [7, 14, 30]
  rolling_metrics: ["mean", "std", "min", "max"]
  include_calendar: true
  include_cyclical: true

baseline:
  model_type: "hist_gradient_boosting"  # or "ridge"
  l2_regularization: 0.1
  max_iter: 200
  random_state: 42

chronos:
  model_id: "amazon/chronos-bolt-small"
  device: "auto"                        # "auto", "cpu", "mps", "cuda"
  torch_dtype: "bfloat16"               # "bfloat16", "float32", "float16"
  prediction_length: 14
  context_length: 64
  num_samples: 20
  temperature: 1.0
  top_k: 50
  top_p: 1.0

backtest:
  strategy: "expanding"                 # "expanding" or "rolling"
  n_splits: 3
  test_size: 14
  stride: 7
